ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=0
update_config=0
country=DE

network={
    ssid="relayap"
    scan_ssid=1
    psk="CiedRelay#1"
    # WPA2-PSK. WPA3-SAE was attempted fleet-wide but the AP (Pi3 Broadcom
    # brcmfmac) CANNOT host SAE/PMF in AP mode — hostapd dies with "key setting
    # validation failed" and the whole AP goes down (2026-07-26). Since the AP is
    # the limiter, clients stay WPA2-PSK regardless of what they individually
    # support. Do not set key_mgmt=SAE / ieee80211w here unless the Pi3's WLAN
    # chip changes — a client requiring PMF won't associate to the non-PMF AP.
    key_mgmt=WPA-PSK
    priority=10
}

# ── HIGH-SECURITY option: WPA-Enterprise (EAP-TLS) ───────────────────────────
# The Pi Zero CAN do per-device-certificate auth via wpa_supplicant (client
# side). BUT this only helps if the AP speaks WPA-Enterprise — and the Pi3's
# brcmfmac AP can't (same driver limitation as SAE). So EAP-TLS here requires a
# SEPARATE RADIUS-capable AP (NOT this Pi3), then a block like:
#
# network={
#     ssid="<enterprise-ssid>"
#     key_mgmt=WPA-EAP
#     eap=TLS
#     identity="relay-pizero-XXXXXX"
#     ca_cert="/etc/wpa_supplicant/certs/ca.pem"
#     client_cert="/etc/wpa_supplicant/certs/relay.pem"
#     private_key="/etc/wpa_supplicant/certs/relay.key"
#     private_key_passwd="..."
#     priority=10
# }
